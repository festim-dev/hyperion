name: festim-hyperion

channels:
  - conda-forge

dependencies:
  - python<3.14  # som pyvista incompatibility issues with python 3.14
  - pip=23.3
  - setuptools<82
  - wheel<0.45
  - jupytext # necessary to open MyST files using BinderHub https://jupyterbook.org/en/stable/interactive/launchbuttons.html#launchbuttons-binder
  - ipywidgets
  - matplotlib
  - ipykernel
  - nbconvert
  - fenics-dolfinx
  - scifem
  - adios2
  - pyvista
  - python-gmsh
  - shapely
  - scipy
  - pyparsing
  - trame
  - vtk
  - trame-vtk<2.10.3
  - trame-vuetify
  - nest-asyncio2
  - pip:
      # the Nitsche interface coupling is not in a FESTIM release yet
      - festim @ git+https://github.com/festim-dev/FESTIM.git@eed1268c5f3d81404817cf5a6f98014b5f5562fa
      - h_transport_materials
      - morethemes
      - drawarrow